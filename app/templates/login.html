{% extends "base.html" %}
{% block content %}

<style>
.login-card {
    width: 100%;
    max-width: 420px;
    background: #ffffff;
    border-radius: 12px;
    padding: 2.5rem;
    box-shadow: 0 25px 50px rgba(15, 23, 42, 0.15);
    border: 1px solid #e2e8f0;
    text-align: center;
}

.login-card h2 {
    font-size: 1.75rem;
    font-weight: 600;
    margin-bottom: 0.5rem;
    color: #0f172a;
}

.login-card p {
    font-size: 0.95rem;
    color: #64748b;
    margin-bottom: 2rem;
}

.login-form {
    display: flex;
    flex-direction: column;
    gap: 14px;
}

.login-form input {
    padding: 0.75rem;
    border-radius: 8px;
    border: 1px solid #e2e8f0;
    font-size: 0.95rem;
}

.login-form input:focus {
    outline: none;
    border-color: #0052CC;
}

.login-form button {
    padding: 0.85rem;
    border-radius: 8px;
    border: none;
    background-color: #0052CC;
    color: #ffffff;
    font-weight: 600;
    cursor: pointer;
    transition: 0.2s ease;
}

.login-form button:hover {
    background-color: #0747A6;
}

.login-footer {
    margin-top: 1.5rem;
    font-size: 0.75rem;
    color: #64748b;
}
</style>

<div class="centered-page">
    <div class="login-card">
        <h2>Login</h2>
        <p>Enter your credentials to access the dashboard.</p>

        <form method="POST" action="/login" class="login-form">
            <input type="text" name="username" placeholder="Username" required />
            <input type="password" name="password" placeholder="Password" required />
            <button type="submit">Sign In</button>
        </form>

        <div class="login-footer">
            Internal secure authentication
        </div>
    </div>
</div>

{% endblock %}
