<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>AI Project Monitor</title>

    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

    <!-- Global Styles -->
    <style>
        :root {
            --primary: #0052CC;
            --primary-hover: #0747A6;
            --bg-dark: #0f172a;
            --bg-light: #f8fafc;
            --text-dark: #0f172a;
            --text-light: #ffffff;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --radius: 12px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-light);
            color: var(--text-dark);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Navbar */
        .navbar {
            height: 64px;
            display: flex;
            align-items: center;
            padding: 0 2rem;
            background-color: var(--bg-dark);
            color: var(--text-light);
            font-weight: 600;
            font-size: 1rem;
            letter-spacing: 0.3px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.15);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* Layout Container */
        .container {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        /* Utility */
        .centered-page {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }

        /* Footer (optional future use) */
        .footer {
            text-align: center;
            padding: 1rem;
            font-size: 0.8rem;
            color: var(--text-muted);
            border-top: 1px solid var(--border);
        }

        @media (max-width: 768px) {
            .navbar {
                padding: 0 1rem;
                font-size: 0.9rem;
            }
        }
    </style>

    <!-- Plotly -->
    <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
</head>
<body>

    <nav class="navbar">
        <span class="brand">🧠 AI Project Intelligence</span>
    </nav>

    <div class="container">
        {% block content %}{% endblock %}
    </div>

    <script src="{{ url_for('static', path='js/main.js') }}"></script>
</body>
</html>
