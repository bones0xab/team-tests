# alertmanager/alertmanager.yml
# Sends ONE consolidated digest per 6 hours — no per-project spam

global:
  resolve_timeout: 5m

route:
  receiver: fastapi-webhook
  group_by: ['alertname']        # group ALL alerts regardless of project
  group_wait: 60s                # wait 60s to collect all alerts before sending
  group_interval: 6h             # only re-notify every 6 hours
  repeat_interval: 24h           # if still firing, resend after 24h max

receivers:
  - name: fastapi-webhook
    webhook_configs:
      - url: http://backend:8000/api/webhook/alert
        send_resolved: true
        max_alerts: 0            # 0 = send all alerts in one payload