# alertmanager/alertmanager.yml
# Sends ONE consolidated digest per 6 hours — no per-project spam

global:
  resolve_timeout: 5m

route:
  receiver: fastapi-webhook
  group_by: ['...']        # group ALL alerts regardless of project
  group_wait: 30s                # wait 30s to collect all alerts before sending
  group_interval: 6h             # only re-notify every 6h if new alerts come in
  repeat_interval: 6h           # if still firing, resend after 6h max

receivers:
  - name: fastapi-webhook
    webhook_configs:
      - url: http://backend:8000/api/webhook/alert
        send_resolved: true
        max_alerts: 0            # 0 = send all alerts in one payload