name: CI Pipeline

on:
  push:
    branches: [ main, develop, featur/test ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  PYTHON_VERSION: '3.11'

jobs:
  lint-and-test:
    name: Lint and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov flake8 black

      - name: Run code formatting check (Black)
        run: |
          black --check .
        continue-on-error: true

      - name: Run linting (Flake8)
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
        continue-on-error: true

      - name: Run unit tests
        run: |
          pytest tests/ -v --cov=services --cov-report=xml --cov-report=term
        continue-on-error: true

      - name: Upload test coverage
        uses: codecov/codecov-action@v4
        if: always()
        with:
          file: ./coverage.xml
          flags: unittests

  validate-code:
    name: Validate Jira Integration
    runs-on: ubuntu-latest
    needs: lint-and-test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate imports and syntax
        run: |
          python -m py_compile main.py
          python -m py_compile services/Auth.py
          python -m py_compile services/Fetch.py
          python -m py_compile services/Normalisation.py

      - name: Check environment variables template
        run: |
          if [ ! -f .env.example ]; then
            echo "⚠️ Warning: .env.example not found"
          else
            echo "✅ .env.example exists"
          fi

      - name: Test authentication module (dry run)
        run: |
          python -c "from services.Auth import jira_session; print('✅ Auth module loads successfully')"

      - name: CI Success
        run: |
          echo "✅ All CI checks passed!"
          echo "📋 Code is ready for review"