stages:
  - test
  - validate

variables:
  PYTHON_VERSION: "3.12.7"
  PIP_CACH_DIR: "$CI_PROJECT_DIR/.cache/pip"


cache:
  key: "$CI_COMMIT_REF_SLUG"
  paths:
    - .cache/pip/

default:
  image: python:3.12-slim
  before_script:
    - python --version
    - python -m pip install --upgrade pip
    - pip config set global.cache-dir "$PIP_CACHE_DIR"


lint_and_test:
  stage: test
  script:
    - pip install -r requirements.txt
    - pip install pytest pytest-cov flake8 black

    # Black (like continue-on-error): don't fail pipeline if it fails
    - black --check . || true

    # Flake8 (like continue-on-error): don't fail pipeline if it fails
    - flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics || true
    - flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics || true

    # Tests (like continue-on-error): don't fail pipeline if it fails
    - pytest tests/ -v --cov=services --cov-report=xml --cov-report=term || true
  artifacts:
    when: always
    paths:
      - coverage.xml
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
    expire_in: 7 days
  rules:
    - if: $CI_PIPELINE_SOURCE == "push"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_PIPELINE_SOURCE == "web"

validate_code:
  stage: validate
  needs: ["lint_and_test"]
  script:
    - pip install -r requirements.txt

    - python -m py_compile main.py
    - python -m py_compile services/Auth.py
    - python -m py_compile services/Fetch.py
    - python -m py_compile services/Normalisation.py

    - |
      if [ ! -f .env.example ]; then
        echo "Warning: .env.example not found"
      else
        echo ".env.example exists"
      fi

    - python -c "from services.Auth import jira_session; print('✅ Auth module loads successfully')"

    - echo "✅ All CI checks passed!"
    - echo "📋 Code is ready for review"
  rules:
    - if: $CI_PIPELINE_SOURCE == "push"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_PIPELINE_SOURCE == "web"