[pytest]
# Marqueurs personnalisés
markers =
    integration: Tests dintégration (Ollama, Jira réel, etc.)
    slow: Tests lents (peuvent prendre >5s)
    jira: Tests nécessitant une connexion Jira réelle

# Options par défaut
addopts = 
    -v
    --tb=short
    --strict-markers

# Timeout global
timeout = 10

# Découverte des tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*