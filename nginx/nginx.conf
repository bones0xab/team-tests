upstream backend { server backend:8000; }
upstream frontend { server frontend:3000; }

limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=webhook:10m rate=1r/s;

server {
    listen 80;
    server_name localhost;

    location / { proxy_pass http://frontend; proxy_set_header Host $host; }
    
    location /api/ {
        limit_req zone=api burst=20 nodelay;
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    
    location /api/webhook/ {
        limit_req zone=webhook burst=5 nodelay;
        proxy_pass http://backend;
    }
    
    location /api/metrics {
        allow 10.0.0.0/8; allow 172.16.0.0/12; allow 192.168.0.0/16;
        deny all; proxy_pass http://backend;
    }
    
    location /health { proxy_pass http://backend; access_log off; }
}
